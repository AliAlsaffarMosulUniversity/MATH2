<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رياضياتي للصف الثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* اتجاه التصميم: بطاقات كبيرة ملونة لكل فصل، لون عنابي للأزرار، خلفية حليبية، خط كبير واضح لطفل في بداية التعلم */
:root{--bg:#fff7ec;--card:#ffffff;--ink:#3a2530;--mut:#7a6670;--pri:#8b1e3f;--pri-ink:#ffffff;--ok:#2b8a3e;--okbg:#d3f9d8;--bad:#c92a2a;--badbg:#ffe3e3;--line:#f0dcc8;--soft:#fdebd3;--hint:#fff3bf}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#241f31;--ink:#f3eaf5;--mut:#b7a9c2;--pri:#e0638a;--pri-ink:#1b0f16;--ok:#69db7c;--okbg:#1d3a27;--bad:#ff8787;--badbg:#44202a;--line:#3a3250;--soft:#2f2842;--hint:#4a4120;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141f;--card:#241f31;--ink:#f3eaf5;--mut:#b7a9c2;--pri:#e0638a;--pri-ink:#1b0f16;--ok:#69db7c;--okbg:#1d3a27;--bad:#ff8787;--badbg:#44202a;--line:#3a3250;--soft:#2f2842;--hint:#4a4120;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal',system-ui,sans-serif;font-size:18px;line-height:1.75;min-height:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{max-width:860px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.top h1{flex:1;margin:0;font-size:20px;font-weight:800;color:var(--pri);text-wrap:balance}
.chip{background:var(--soft);border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
.ib{border:0;background:var(--soft);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px}
.btn{border:0;background:var(--pri);color:var(--pri-ink);padding:10px 22px;border-radius:14px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px}
.hero{display:flex;gap:14px;align-items:center;margin:18px 0}
.owl{font-size:62px;line-height:1}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 16px;flex:1}
.bar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f59f00,#e8590c);border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.chcard{border:0;text-align:right;color:#fff;border-radius:22px;padding:16px;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:4px;min-height:132px}
.chcard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.chcard .em{font-size:38px;line-height:1.2}.chcard b{font-size:19px;line-height:1.4}.chcard small{opacity:.95;font-size:15px}
.les{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;color:var(--ink)}
.les .no{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.les .tt{flex:1;font-weight:700;line-height:1.5}
.stars{letter-spacing:2px;white-space:nowrap}
h2{font-size:24px;margin:18px 0 4px;text-wrap:balance}
.sec{font-weight:800;color:var(--pri);margin:22px 0 8px;font-size:20px}
.step{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.step .vis{font-size:70px;line-height:1.3;min-height:90px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
.step .vis .blk{--u:1.3}
.step p{font-size:21px;margin:8px 0;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri)}
.eq{unicode-bidi:isolate;font-weight:800;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;vertical-align:middle;margin:0 4px;font-weight:800;direction:ltr}
.fr i{font-style:normal;border-bottom:3px solid currentColor;padding:0 6px}.fr b{padding:0 6px}
/* مكعبات القيمة المكانية */
.blk{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;justify-content:center;direction:ltr;--u:1}
.b100{width:calc(54px*var(--u));height:calc(54px*var(--u));background:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px) 0 0/100% 10%,linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px) 0 0/10% 100%,#4dabf7;border:2px solid #1c7ed6;border-radius:4px;display:block}
.b10{width:calc(11px*var(--u));height:calc(54px*var(--u));background:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px) 0 0/100% 10%,#51cf66;border:2px solid #2b8a3e;border-radius:3px;display:block}
.b1{width:calc(12px*var(--u));height:calc(12px*var(--u));background:#ffa94d;border:2px solid #e8590c;border-radius:3px;display:block}
.sm{--u:.5}.x{opacity:.25;filter:grayscale(1)}
/* الأدوات التفاعلية */
.w{background:var(--card);border:2px dashed var(--pri);border-radius:22px;padding:16px;margin-top:6px}
.w .ttl{font-weight:800;color:var(--pri);margin-bottom:8px}
.cols{display:flex;gap:8px;direction:ltr}
.col{flex:1;border:2px solid var(--c);border-radius:16px;padding:8px;background:var(--bg);min-width:0}
.col .ch{text-align:center;font-weight:800;color:var(--c);direction:rtl}
.pieces{min-height:84px;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;justify-content:center;padding:6px 0}
.col .btns{display:flex;gap:8px;justify-content:center;align-items:center}
.rb{width:42px;height:42px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:24px;font-weight:800}
.big{font-size:54px;font-weight:800;text-align:center;color:var(--pri);line-height:1.2}
.exp{text-align:center;font-weight:700;color:var(--mut)}
.msg{min-height:30px;text-align:center;font-weight:700;color:var(--ok)}
.ngrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;direction:ltr}
.ngrid button,.numbtn{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 0;font-weight:800}
.ngrid button.on,.numbtn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.pr{display:inline-flex;gap:4px;padding:6px 8px;margin:4px;border-radius:14px;background:var(--soft)}
.pr i{width:22px;height:22px;border-radius:50%;background:#f76707;display:block}.pr i.lone{background:transparent;border:2px dashed var(--bad)}
.pcenter{text-align:center;margin-top:10px;font-weight:700}
.cmp{display:flex;align-items:center;justify-content:space-around;gap:6px;direction:ltr;text-align:center}
.cmp .side{flex:1;min-width:0}.cmp .num{font-size:36px;font-weight:800}.cmp .sg{font-size:46px;font-weight:800;color:var(--pri);width:90px}
.tbl{border-collapse:collapse;direction:rtl;margin:8px auto}.tbl td,.tbl th,.mt td,.mt th{border:2px solid var(--line);padding:4px 14px;text-align:center}.mt{border-collapse:collapse;margin:8px auto}
.colgrid{display:grid;direction:ltr;gap:4px;justify-content:center;margin:10px auto;font-size:34px;font-weight:800;text-align:center}
.colgrid div{min-height:46px;display:grid;place-items:center;border-radius:10px}
.colgrid .mk{font-size:15px;color:var(--bad);min-height:24px}.colgrid .cur{background:var(--hint)}.colgrid .line{border-top:4px solid var(--ink);min-height:0;padding:0}
.say{background:var(--soft);border-radius:16px;padding:10px 14px;margin-top:8px;font-weight:600}
.stp .head{font-size:26px;font-weight:800;text-align:center;margin-bottom:6px}.stp-s{background:var(--soft);border-radius:14px;padding:8px 14px;margin-top:8px;font-weight:600}
.tri{display:flex;flex-direction:column;align-items:center;gap:6px}.tri .tp{display:flex;gap:70px}
.cir{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff;background:#f08c00}.cir.s{background:var(--pri)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tlrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.tlrow .nm{width:92px;font-weight:700}.tlrow .tv{flex:1;direction:ltr;color:var(--pri);overflow-x:auto}.tlrow .ct{font-weight:800;width:30px;text-align:center}
.hbar{height:18px;border-radius:9px;background:var(--c,#f59f00);transition:width .3s}
.mono{direction:ltr}
.mchip{border:0;border-radius:14px;padding:8px 6px;font-weight:700;color:#fff;background:var(--c)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:15px;font-weight:700}.legend span{padding:2px 10px;border-radius:99px;color:#fff;background:var(--c)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.cardw .cv{display:flex;justify-content:center;font-size:80px;line-height:1.3;min-height:110px;align-items:center}.cardw .ct2{font-size:22px;font-weight:800;text-align:center}.cardw p{text-align:center;margin:4px 0;font-weight:600}
.mult .plate{display:inline-flex;flex-wrap:wrap;gap:2px;width:92px;justify-content:center;border:2px solid var(--line);border-radius:50%;padding:8px;margin:4px;background:var(--bg);min-height:60px;align-content:center}
.mult .plate span{font-size:22px}
.t5{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;direction:ltr;text-align:center;font-weight:800}.t5 div{padding:8px 0;border-radius:10px;background:var(--bg)}.t5 .h{background:var(--pri);color:var(--pri-ink)}.t5 .c{cursor:pointer;border:2px solid var(--line)}.t5 .on{background:var(--hint);border-color:#f59f00}
.bk img{width:100%;display:block;border-radius:14px;border:2px solid var(--line);margin-bottom:10px;cursor:zoom-in;background:#fff}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;overflow:auto;padding:12px;text-align:center}.zoom img{width:100%;max-width:1000px;border-radius:8px;background:#fff}.zoom button{position:sticky;top:0;z-index:2}
/* الاختبار */
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.qtxt{font-size:23px;font-weight:700;margin-bottom:12px;text-wrap:balance}
.qtxt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:3px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 8px;font-weight:800;font-size:22px;min-height:62px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.hint{background:var(--hint);border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:600}
.fb{font-size:22px;font-weight:800;margin-top:10px;text-align:center}
.res{text-align:center}.res .e{font-size:84px}
.emo{font-size:40px;letter-spacing:6px;text-align:center}
.tl svg{max-width:100%;height:auto}
.pick{display:flex;gap:8px;flex-wrap:wrap}.pick button{border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 18px;border-radius:14px;font-weight:800}.pick button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.cf{position:fixed;top:-40px;font-size:28px;z-index:99;pointer-events:none;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
input[type=range]{width:100%}
input.nm{font-family:inherit;font-size:18px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:150px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){body{font-size:17px}.big{font-size:44px}.opt{font-size:20px}.cmp .sg{width:60px}.ngrid{gap:4px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== أدوات عامة ====== */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,p,...kids){const e=document.createElement(tag);for(const k in (p||{})){if(k==='class')e.className=p[k];else if(k==='html')e.innerHTML=p[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),p[k]);else e.setAttribute(k,p[k]);}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const E=s=>`<span class="eq" dir="ltr">${s}</span>`;
const C=(n,s,p)=>(n>=3&&n<=10)?`${n} ${p}`:`${n} ${s}`;
const pad=n=>String(n).padStart(2,'0');
const fr=(k,d)=>`<span class="fr"><i>${k}</i><b>${d}</b></span>`;
const GT='&gt;',LT='&lt;';

/* قراءة الأعداد بالكلمات (أسلوب الكتاب المدرسي) */
const U1=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const U2=['','واحد','اثنان','ثلاث','أربع','خمس','ست','سبع','ثمان','تسع'];
const T10=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const HUN=['','مئة','مئتان','ثلاث مئة','أربع مئة','خمس مئة','ست مئة','سبع مئة','ثمان مئة','تسع مئة'];
function words(n){if(n===0)return 'صفر';const h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(HUN[h]);if(r){if(r<10)p.push(U1[r]);else if(r<20)p.push(T10[r-10]);else{const t=Math.floor(r/10),o=r%10;p.push(o?U2[o]+' و'+TENS[t]:TENS[t]);}}return p.join(' و');}

/* ====== رسومات ====== */
function blocksHTML(h,t,o,sm){let s='<div class="blk'+(sm?' sm':'')+'">';for(let i=0;i<h;i++)s+='<i class="b100"></i>';for(let i=0;i<t;i++)s+='<i class="b10"></i>';for(let i=0;i<o;i++)s+='<i class="b1"></i>';return s+'</div>';}
function tallySVG(n){const g=Math.floor(n/5),r=n%5,gs=g+(r?1:0),w=gs*54+10;let s=`<svg viewBox="0 0 ${w} 46" width="${w}" height="46" style="color:#8b1e3f" aria-label="علامات عد">`;const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`;for(let k=0;k<gs;k++){const x0=k*54+10,c=k<g?4:r;for(let i=0;i<c;i++)s+=ln(x0+i*9,8,x0+i*9,38);if(k<g)s+=ln(x0-5,34,x0+35,12);}return s+'</svg>';}
function clockSVG(hh,mm,sz=130){let s=`<svg viewBox="0 0 120 120" width="${sz}" height="${sz}"><circle cx="60" cy="60" r="56" fill="#fff" stroke="#8b1e3f" stroke-width="4"/>`;for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${(60+44*Math.sin(a)).toFixed(1)}" y="${(60-44*Math.cos(a)+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#333">${i}</text>`;}const ma=mm*6*Math.PI/180,ha=((hh%12)*30+mm*.5)*Math.PI/180;s+=`<line x1="60" y1="60" x2="${(60+30*Math.sin(ha)).toFixed(1)}" y2="${(60-30*Math.cos(ha)).toFixed(1)}" stroke="#222" stroke-width="6" stroke-linecap="round"/><line x1="60" y1="60" x2="${(60+45*Math.sin(ma)).toFixed(1)}" y2="${(60-45*Math.cos(ma)).toFixed(1)}" stroke="#d6336c" stroke-width="3.5" stroke-linecap="round"/><circle cx="60" cy="60" r="4.5" fill="#222"/></svg>`;return s;}
function rulerSVG(len){let s=`<svg viewBox="0 0 330 88" width="330" style="max-width:100%;height:auto" aria-label="مسطرة"><rect x="10" y="8" width="${len*20}" height="20" rx="6" fill="#f08c00" stroke="#c75f00" stroke-width="2"/><rect x="10" y="36" width="300" height="34" fill="#ffe8a3" stroke="#b8860b" stroke-width="2"/>`;for(let i=0;i<=15;i++){const x=10+i*20;s+=`<line x1="${x}" y1="36" x2="${x}" y2="${i%5===0?56:48}" stroke="#7a5200" stroke-width="2"/><text x="${x}" y="${i%5===0?68:68}" text-anchor="middle" font-size="11" font-weight="700" fill="#5a3b00">${i}</text>`;}return s+'</svg>';}
function pieSVG(d,k,sz=130,cols){let s=`<svg viewBox="0 0 120 120" width="${sz}" height="${sz}">`;for(let i=0;i<d;i++){const a1=(-90+i*360/d)*Math.PI/180,a2=(-90+(i+1)*360/d)*Math.PI/180,x1=60+56*Math.cos(a1),y1=60+56*Math.sin(a1),x2=60+56*Math.cos(a2),y2=60+56*Math.sin(a2);const on=cols?cols.includes(i):i<k;s+=`<path data-i="${i}" d="M60 60 L${x1.toFixed(2)} ${y1.toFixed(2)} A56 56 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${on?'#f59f00':'#fff'}" stroke="#8b1e3f" stroke-width="3" stroke-linejoin="round"/>`;}return s+'</svg>';}
function shapeSVG(name,sz=90,showV){const V={'مربع':[[15,15],[75,15],[75,75],[15,75]],'مستطيل':[[6,22],[84,22],[84,68],[6,68]],'مثلث':[[45,10],[82,76],[8,76]]};let s=`<svg viewBox="0 0 90 90" width="${sz}" height="${sz}" aria-label="${name}">`;if(name==='دائرة')s+='<circle cx="45" cy="45" r="35" fill="#74c0fc" stroke="#1c7ed6" stroke-width="4"/>';else s+=`<polygon points="${V[name].map(p=>p.join(',')).join(' ')}" fill="#ffd8a8" stroke="#e8590c" stroke-width="4" stroke-linejoin="round"/>`;if(showV&&V[name])V[name].forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#c92a2a"/>`);return s+'</svg>';}
function lineSVG(kind){const c='#8b1e3f';let s=`<svg viewBox="0 0 200 44" width="220" height="48" aria-label="${kind}"><line x1="22" y1="22" x2="178" y2="22" stroke="${c}" stroke-width="4"/>`;const head=(x,d)=>`<polygon points="${x},22 ${x+d*14},14 ${x+d*14},30" fill="${c}"/>`;if(kind==='مستقيم')s+=head(14,1)+head(186,-1);else if(kind==='شعاع')s+=`<circle cx="22" cy="22" r="6" fill="${c}"/>`+head(186,-1);else s+=`<circle cx="22" cy="22" r="6" fill="${c}"/><circle cx="178" cy="22" r="6" fill="${c}"/>`;return s+'</svg>';}

/* ====== مولّد الأسئلة ====== */
function mc(q,ans,wr,hint,o){o=o||{};ans=String(ans);let set=[ans];wr.forEach(w=>{w=String(w);if(/^-/.test(w))return;if(!set.includes(w))set.push(w);});
 if(o.fill!==false&&/^\d+$/.test(ans)){const n=+ans;for(const x of [n+1,n-1,n+10,n-10,n+2,n-2,n+5,n-5,n+100,n-100]){if(set.length>=4)break;if(x>=0&&!set.includes(String(x)))set.push(String(x));}}
 set=set.slice(0,4);const op=shuf(set);return {q,o:op,a:op.indexOf(ans),h:hint||'',k:q+'|'+ans};}
const G={};
G.hundreds=()=>{const t=R(0,2),x=R(1,9);

function genQs(gens,count,staticList){const out=[],seen=new Set();let pool=gens.slice(),i=0,fails=0;
 if(staticList){shuf(staticList()).forEach(q=>{if(out.length<count&&!seen.has(q.k)){seen.add(q.k);out.push(q);}});}
 while(out.length<count&&pool.length&&fails<400){const g=pool[i%pool.length];const q=g();if(seen.has(q.k)){fails++;i++;continue;}seen.add(q.k);out.push(q);i++;}
 return out;}
